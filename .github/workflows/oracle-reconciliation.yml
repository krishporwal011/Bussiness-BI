name: Oracle reconciliation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oracle-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download the official UCI Online Retail dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw
          archive=/tmp/online-retail.zip
          extracted=/tmp/online-retail-extracted
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://archive.ics.uci.edu/static/public/352/online+retail.zip" \
            --output "$archive"
          rm -rf "$extracted"
          mkdir -p "$extracted"
          unzip -q "$archive" -d "$extracted"
          dataset="$(find "$extracted" -type f -iname 'Online Retail.xlsx' -print -quit)"
          test -n "$dataset"
          cp "$dataset" "data/raw/Online Retail.xlsx"
          test -s "data/raw/Online Retail.xlsx"

      - name: Generate Python outputs
        run: |
          python src/clean_data.py
          python src/market_basket_analysis.py

      - name: Generate an ephemeral Oracle password
        shell: bash
        run: |
          set -euo pipefail
          db_password="Mb$(python -c 'import secrets; print("".join(secrets.choice("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789") for _ in range(20)))')9!"
          echo "::add-mask::$db_password"
          echo "DB_PASSWORD=$db_password" >> "$GITHUB_ENV"

      - name: Start Oracle Database Free
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name oracle-free \
            --publish 1521:1521 \
            --shm-size=1g \
            --env ORACLE_PASSWORD="$DB_PASSWORD" \
            --volume oracle-data:/opt/oracle/oradata \
            docker.io/gvenzl/oracle-free:full

      - name: Wait for Oracle and verify client tools
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if docker logs oracle-free 2>&1 | grep -q "DATABASE IS READY TO USE!"; then
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              docker logs oracle-free
              exit 1
            fi
            sleep 5
          done
          docker exec oracle-free sh -lc 'command -v sqlplus && command -v sqlldr'

      - name: Copy SQL project files into Oracle
        shell: bash
        run: |
          set -euo pipefail
          docker exec oracle-free mkdir -p /tmp/market-basket/sql /tmp/market-basket/data/derived /tmp/market-basket/oracle_exports
          docker cp sql/. oracle-free:/tmp/market-basket/sql/
          docker cp data/derived/sql_staging.csv oracle-free:/tmp/market-basket/data/derived/sql_staging.csv

      - name: Execute schema and staging setup
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i oracle-free sqlplus -s /nolog <<SQL
          whenever sqlerror exit sql.sqlcode
          connect system/${DB_PASSWORD}@//localhost:1521/FREEPDB1
          @/tmp/market-basket/sql/01_create_schema.sql
          @/tmp/market-basket/sql/02_create_tables.sql
          @/tmp/market-basket/sql/04_load_staging.sql
          exit
          SQL

      - name: Load staging CSV with SQL*Loader
        shell: bash
        run: |
          set -euo pipefail
          docker exec oracle-free sqlldr \
            "userid=system/${DB_PASSWORD}@//localhost:1521/FREEPDB1" \
            control=/tmp/market-basket/sql/stg_transaction_line.ctl \
            data=/tmp/market-basket/data/derived/sql_staging.csv \
            log=/tmp/market-basket/oracle_staging_load.log \
            skip=1 \
            direct=true

      - name: Execute transforms, constraints, views, and validation
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i oracle-free sqlplus -s /nolog <<SQL
          whenever sqlerror exit sql.sqlcode
          connect system/${DB_PASSWORD}@//localhost:1521/FREEPDB1
          @/tmp/market-basket/sql/05_transform_clean.sql
          @/tmp/market-basket/sql/03_create_constraints_indexes.sql
          @/tmp/market-basket/sql/07_create_views.sql
          @/tmp/market-basket/sql/08_validation_reconciliation.sql
          exit
          SQL

      - name: Export Oracle pair metrics
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i oracle-free sqlplus -s /nolog <<SQL
          whenever sqlerror exit sql.sqlcode
          connect system/${DB_PASSWORD}@//localhost:1521/FREEPDB1
          set markup csv on
          set heading on
          set feedback off
          set echo off
          set termout off
          set trimspool on
          set numformat TM9
          spool /tmp/market-basket/oracle_exports/oracle_pair_metrics.csv
          @/tmp/market-basket/sql/06_pair_queries.sql
          spool off
          exit
          SQL
          mkdir -p outputs
          docker cp oracle-free:/tmp/market-basket/oracle_exports/oracle_pair_metrics.csv outputs/oracle_pair_metrics.csv
          test -s outputs/oracle_pair_metrics.csv
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path("outputs/oracle_pair_metrics.csv")
          frame = pd.read_csv(path)
          frame.columns = [column.strip().lower() for column in frame.columns]
          frame.to_csv(path, index=False)
          PY

      - name: Reconcile Oracle output with Python output
        run: |
          python src/reconcile_sql_python.py \
            --python outputs/python_pair_metrics.csv \
            --sql outputs/oracle_pair_metrics.csv

      - name: Collect Oracle logs
        if: always()
        shell: bash
        run: |
          set +e
          docker logs oracle-free > oracle-container.log 2>&1
          docker cp oracle-free:/tmp/market-basket/oracle_staging_load.log oracle-staging-load.log
          true

      - name: Upload reconciliation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-reconciliation-output
          if-no-files-found: warn
          path: |
            outputs/oracle_pair_metrics.csv
            reports/sql_python_reconciliation.csv
            reports/sql_python_reconciliation.md
            oracle-container.log
            oracle-staging-load.log

      - name: Remove Oracle container
        if: always()
        shell: bash
        run: docker rm --force oracle-free 2>/dev/null || true
